<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>İngilizce Öğreniyorum — B1</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🇬🇧 İngilizce Öğreniyorum <span class="level-badge">B1</span></h1>
    <p class="subtitle">Kelimeler, okuma ve dinleme ile günlük pratik yap</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="words" role="tab" aria-selected="true">📚 Words</button>
    <button class="tab-btn" data-tab="reading" role="tab" aria-selected="false">📖 Reading</button>
    <button class="tab-btn" data-tab="listening" role="tab" aria-selected="false">🎧 Listening</button>
  </nav>

  <main>
    <!-- WORDS -->
    <section id="words" class="tab-panel active">
      <div class="toolbar">
        <button id="refresh-words" class="refresh-btn">🔄 Yenile</button>
        <label class="toggle">
          <input type="checkbox" id="toggle-tr" checked />
          Türkçe anlamları göster
        </label>
      </div>
      <div id="words-grid" class="words-grid"></div>
    </section>

    <!-- READING -->
    <section id="reading" class="tab-panel">
      <div class="toolbar">
        <button id="refresh-reading" class="refresh-btn">🔄 Yenile</button>
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">Tümü</button>
          <button class="filter-btn" data-filter="story">Hikayeler</button>
          <button class="filter-btn" data-filter="engineering">Mühendislik</button>
          <button class="filter-btn" data-filter="technology">Teknoloji</button>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggle-reading-tr" checked />
          Çeviriyi göster
        </label>
      </div>
      <div id="reading-card" class="paragraph-card"></div>
    </section>

    <!-- LISTENING -->
    <section id="listening" class="tab-panel">
      <div class="toolbar">
        <button id="refresh-listening" class="refresh-btn">🔄 Yenile</button>
        <button id="play-listening" class="refresh-btn play-btn">▶️ Dinle</button>
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">Tümü</button>
          <button class="filter-btn" data-filter="story">Hikayeler</button>
          <button class="filter-btn" data-filter="engineering">Mühendislik</button>
          <button class="filter-btn" data-filter="technology">Teknoloji</button>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggle-listening-text" />
          Yazılı metni göster
        </label>
      </div>
      <p class="listening-hint">Önce sadece dinlemeyi dene, sonra metni açarak kontrol et.</p>
      <div id="listening-card" class="paragraph-card"></div>
    </section>
  </main>

  <footer>
    <p>Her yenilemede yeni içerik gösterilir. Havuzdaki tüm içerik gösterilmeden tekrar etmez.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
